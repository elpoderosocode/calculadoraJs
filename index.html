    <div class="container">
        <div class="products-header">
            <div class="title">BRUNCH </div>

                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1"/>
                </svg>
                <span>0</span>
            </div>
        </div>
        <div class="listProduct">
            <!-- <div class="item">
                <img src="image/1.png" alt="">
                <h2>RED VELVET</h2>
                <div class="price">$14.000</div>
                <button class="addCart">
                    Añadir al carrito
                </button>
            </div> -->
        </div>
    </div>
    <div class="cartTab">
        <h1>Carrito de Compras</h1>
        <div class="listCart"></div>
            <!-- <div class="item">
                <div class="image">
                    <img src="image/1.png" alt="" class="image">
                </div>
                <div class="name">
                    Nombre
                </div>
                <div class="totalPrice">
                    $14.000
                </div>
                <div class="quantity">
                    <span class="minus"></span>
                    <span>1</span>
                    <span class="plus"></span>
                </div>
            </div> -->

            <!--Aqui añadimos el total-->
            <div class="cartTotal">
                <span>Total:</span>
                <span class="totalAmount">$0</span>
            </div>
            <!--Aqui añadimos los datos del cliente-->
            <div class="cartForm">
    <label>
        Nombre:
        <input type="text" id="clientName" required>
    </label>
    <label>
        Teléfono:
        <input type="text" id="clientPhone" required>
    </label>
    <label>
        Método de pago:
        <select id="paymentMethod" required>
            <option value="Efectivo">Efectivo</option>
            <option value="Transferencia">Transferencia</option>
            <option value="Tarjeta">Tarjeta</option>
        </select>
    </label>
    <label>
        Entrega:
        <select id="deliveryType" required>
            <option value="Recoger en tienda">Recoger en tienda</option>
            <option value="Domicilio">Domicilio</option>
        </select>
    </label>
    <label id="addressField" style="display:none;">
        Dirección:
        <input type="text" id="clientAddress">
    </label>
</div>

        <div class="btn">
            <button class="close">Cerrar</button>
            <button class="checkOut">Realizar Pago</button>
        </div>
    </div>

    <script src="app.js"></script>
